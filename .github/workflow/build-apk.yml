name: Build PMView Mail APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PMView Mail project
        run: |
          unzip -q PMViewMail-source-with-apk-workflow.zip
          ls -la PMViewMail

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licences
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 37
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build APK
        working-directory: PMViewMail
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp PMViewMail/app/build/outputs/apk/debug/app-debug.apk PMView-Mail-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PMView-Mail-APK
          path: PMView-Mail-v1.0.apk
          retention-days: 30
